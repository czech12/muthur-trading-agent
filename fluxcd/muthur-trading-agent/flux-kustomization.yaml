# Flux's own Kustomization resource for this app - lives in flux-system,
# separate from the plain kustomization.yaml alongside it (which lists the
# actual manifests), so reconciliation settings like interval and health
# checks can be tuned independently of the resource list.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alpaca-hackathon-agent
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 20s
  path: ./fluxcd/muthur-trading-agent
  prune: true # remove any elements later removed from the above path
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: alpaca-hackathon-agent
      namespace: alpaca-hackathon-agent
