---
# Same registry robot-account credential used by the agent's own cluster,
# resealed for this cluster's key. Read-only image pull use only - never
# given to the running container itself.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-push-auth
  namespace: default
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: harbor-push-auth
      namespace: default
    type: kubernetes.io/dockerconfigjson
