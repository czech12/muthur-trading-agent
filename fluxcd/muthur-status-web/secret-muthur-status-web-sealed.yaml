---
# ALPACA_API_KEY/ALPACA_SECRET_KEY: same key pair as the trading agent
# (Alpaca paper accounts support only one active key pair), used here for
# read-only GET calls only - see src/app.py.
#
# GRAFANA_API_TOKEN: a dedicated Viewer-role-only service-account token for
# this deployment - confirmed it can read Loki but gets a 403 on write/admin
# calls. Not an admin token.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: muthur-status-web-secret
  namespace: default
spec:
  encryptedData:
    ALPACA_API_KEY: 
    ALPACA_SECRET_KEY: 
    GRAFANA_API_TOKEN: 
  template:
    metadata:
      name: muthur-status-web-secret
      namespace: default
    type: Opaque
