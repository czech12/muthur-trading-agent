<svg width="960" height="780" viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MU/TH/UR 8400, 100% self-hosted infrastructure: a self-hosted GitLab repo builds through an in-cluster BuildKit job to a self-hosted Harbor registry, while Flux watches the same repo and reconciles two self-hosted Talos Kubernetes clusters — one internal, running the agent, one external, running the live status site">
  <defs>
    <radialGradient id="infraGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#33ff66" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <marker id="iArrowDim" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b6b76"/>
    </marker>
    <marker id="iArrowGate" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#33ff66"/>
    </marker>
  </defs>

  <rect width="960" height="780" fill="#0a0a0d"/>
  <rect width="960" height="780" fill="url(#infraGlow)"/>

  <rect x="20" y="20" width="920" height="740" rx="16" fill="#000000" stroke="#1c8f3d" stroke-width="1.5"/>
  <line x1="20" y1="80" x2="940" y2="80" stroke="#1c8f3d" stroke-width="1"/>
  <circle cx="54" cy="50" r="4.5" fill="#33ff66"/>
  <circle cx="70" cy="50" r="4.5" fill="#33ff66"/>
  <circle cx="86" cy="50" r="4.5" fill="#33ff66"/>
  <text x="104" y="54" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#9fffb8" letter-spacing="1">MU/TH/UR 8400 — 100% SELF-HOSTED INFRASTRUCTURE</text>
  <text x="908" y="54" text-anchor="end" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#9fffb8" letter-spacing="1">NOSTROMO</text>

  <!-- Lane 1: build + GitOps -->
  <rect x="40" y="94" width="880" height="368" rx="10" fill="#0a0a0d" stroke="#26262e"/>

  <rect x="210" y="128" width="280" height="70" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="350" y="158" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#f5f5f7">PRIVATE GIT</text>
  <text x="350" y="180" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">self-hosted GitLab</text>

  <rect x="530" y="128" width="280" height="70" rx="10" fill="#000000" stroke="#33ff66" stroke-width="2"/>
  <text x="670" y="158" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#9fffb8">FLUX</text>
  <text x="670" y="180" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#9fffb8">watches repo, reconciles clusters</text>

  <rect x="210" y="250" width="400" height="70" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="410" y="280" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#f5f5f7">BUILDKIT JOB</text>
  <text x="410" y="302" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">self-hosted, runs in-cluster</text>

  <rect x="210" y="372" width="400" height="70" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="410" y="402" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#f5f5f7">HARBOR REGISTRY</text>
  <text x="410" y="424" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">self-hosted, not a cloud registry</text>

  <!-- Lane 2: two self-hosted Talos clusters -->
  <rect x="40" y="502" width="880" height="238" rx="10" fill="#0a0a0d" stroke="#26262e"/>

  <rect x="90" y="542" width="340" height="70" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="260" y="569" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f7">TALOS CLUSTER — INTERNAL</text>
  <text x="260" y="590" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">no path in from the internet</text>

  <rect x="530" y="542" width="340" height="70" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="700" y="569" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f7">TALOS CLUSTER — EXTERNAL</text>
  <text x="700" y="590" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">publicly reachable</text>

  <rect x="90" y="650" width="340" height="70" rx="10" fill="#0a0a0d" stroke="#33ff66" stroke-width="2"/>
  <text x="260" y="677" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#9fffb8">TRADING AGENT</text>
  <text x="260" y="698" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">the only piece that can place trades</text>

  <rect x="530" y="650" width="340" height="70" rx="10" fill="#0a0a0d" stroke="#33ff66" stroke-width="2"/>
  <text x="700" y="677" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#9fffb8">LIVE STATUS SITE</text>
  <text x="700" y="698" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#a8a8b3">read-only, no order-placing code</text>

  <!-- All connecting lines, drawn before any inline label so no label ever ends up underneath one -->
  <path d="M 490,150 L 530,150" fill="none" stroke="#33ff66" stroke-width="1.5" marker-end="url(#iArrowGate)"/>
  <path d="M 350,198 L 350,250" fill="none" stroke="#a8a8b3" stroke-width="1.5" marker-end="url(#iArrowDim)"/>
  <path d="M 410,320 L 410,372" fill="none" stroke="#a8a8b3" stroke-width="1.5" marker-end="url(#iArrowDim)"/>
  <path d="M 260,612 L 260,650" fill="none" stroke="#a8a8b3" stroke-width="1.5" marker-end="url(#iArrowDim)"/>
  <path d="M 700,612 L 700,650" fill="none" stroke="#a8a8b3" stroke-width="1.5" marker-end="url(#iArrowDim)"/>

  <!-- Harbor -> both clusters (image pull) -->
  <path d="M 300,442 L 300,500 L 260,500 L 260,542" fill="none" stroke="#a8a8b3" stroke-width="1.5" marker-end="url(#iArrowDim)"/>
  <path d="M 520,442 L 520,500 L 680,500 L 680,542" fill="none" stroke="#a8a8b3" stroke-width="1.5" marker-end="url(#iArrowDim)"/>

  <!-- Flux -> both clusters (GitOps reconcile, dashed) -->
  <path d="M 720,198 L 720,542" fill="none" stroke="#33ff66" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#iArrowGate)"/>
  <path d="M 670,198 L 670,221 L 70,221 L 70,577 L 90,577" fill="none" stroke="#33ff66" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#iArrowGate)"/>

  <!-- Inline labels last, each on a solid backdrop so nothing can ever show through -->
  <rect x="432" y="333" width="96" height="16" fill="#0a0a0d"/>
  <text x="440" y="344" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">pushes image</text>

  <rect x="364" y="469" width="92" height="16" fill="#0a0a0d"/>
  <text x="410" y="480" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">pulls image</text>

  <rect x="732" y="333" width="132" height="16" fill="#0a0a0d"/>
  <text x="740" y="344" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">reconciles config</text>
</svg>
