<svg width="960" height="760" viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MU/TH/UR 8400 memory and scanning: recent history and the Daily Agent Loop read each other every check-in, while a market scan of news, movers, and most-actives passes each candidate through a single-quote liquidity gate before it either gets dropped or has its full options chain pulled">
  <defs>
    <radialGradient id="msGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#33ff66" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <marker id="msArrowDim" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6.75" orient="auto">
      <path d="M0,0 L13.5,6.75 L0,13.5 Z" fill="#6b6b76"/>
    </marker>
    <marker id="msArrowBright" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6.75" orient="auto">
      <path d="M0,0 L13.5,6.75 L0,13.5 Z" fill="#33ff66"/>
    </marker>
    <marker id="msArrowRejected" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6.75" orient="auto">
      <path d="M0,0 L13.5,6.75 L0,13.5 Z" fill="#a8a8b3"/>
    </marker>
  </defs>

  <rect width="960" height="760" fill="#0a0a0d"/>
  <rect width="960" height="760" fill="url(#msGlow)"/>

  <rect x="20" y="20" width="920" height="720" rx="16" fill="#000000" stroke="#1c8f3d" stroke-width="1.5"/>
  <line x1="20" y1="80" x2="940" y2="80" stroke="#1c8f3d" stroke-width="1"/>
  <circle cx="54" cy="50" r="4.5" fill="#33ff66"/>
  <circle cx="70" cy="50" r="4.5" fill="#33ff66"/>
  <circle cx="86" cy="50" r="4.5" fill="#33ff66"/>
  <text x="104" y="54" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#9fffb8" letter-spacing="1">MU/TH/UR 8400 — MEMORY &amp; SCANNING</text>
  <text x="908" y="54" text-anchor="end" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#9fffb8" letter-spacing="1">NOSTROMO</text>

  <!-- Lane A: Memory -->
  <rect x="40" y="94" width="880" height="212" rx="10" fill="#0a0a0d" stroke="#26262e"/>
  <text x="58" y="115" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700" fill="#6b6b76" letter-spacing="1.5">CARRIES INTO EVERY CHECK-IN</text>

  <rect x="100" y="140" width="310" height="112" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="255" y="172" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#f5f5f7">RECENT HISTORY</text>
  <text x="255" y="196" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13.5" fill="#a8a8b3">thesis · rationale · outcome</text>
  <text x="255" y="218" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">capped, persisted across restarts</text>

  <rect x="550" y="140" width="310" height="112" rx="10" fill="#0a0a0d" stroke="#33ff66" stroke-width="2"/>
  <text x="705" y="172" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#9fffb8">DAILY AGENT LOOP</text>
  <text x="705" y="196" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="13.5" fill="#9fffb8">checks its own prior thesis</text>
  <text x="705" y="218" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">before deciding anything new</text>

  <path d="M 410,178 L 550,178" fill="none" stroke="#9fffb8" stroke-width="1.75" marker-end="url(#msArrowBright)"/>
  <text x="480" y="166" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#9fffb8">reads back</text>

  <path d="M 550,222 L 410,222" fill="none" stroke="#6b6b76" stroke-width="1.5" marker-end="url(#msArrowDim)"/>
  <text x="480" y="244" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">appends new entry</text>

  <!-- Lane B: Scanning -->
  <rect x="40" y="326" width="880" height="384" rx="10" fill="#0a0a0d" stroke="#26262e"/>
  <text x="58" y="347" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700" fill="#6b6b76" letter-spacing="1.5">NO FIXED WATCHLIST — SCANNED FRESH EACH CHECK-IN</text>

  <rect x="70" y="380" width="230" height="90" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="185" y="418" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f7">NEWS / MOVERS /</text>
  <text x="185" y="440" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f7">MOST-ACTIVES</text>

  <rect x="370" y="395" width="180" height="60" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="460" y="431" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f7">CANDIDATE</text>

  <rect x="620" y="380" width="230" height="90" rx="10" fill="#000000" stroke="#33ff66" stroke-width="2.5"/>
  <text x="735" y="418" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#9fffb8">LIQUIDITY GATE</text>
  <text x="735" y="440" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#9fffb8">single ATM quote, checked first</text>

  <path d="M 300,425 L 370,425" fill="none" stroke="#6b6b76" stroke-width="1.5" marker-end="url(#msArrowDim)"/>
  <path d="M 550,425 L 620,425" fill="none" stroke="#6b6b76" stroke-width="1.5" marker-end="url(#msArrowDim)"/>

  <rect x="370" y="570" width="230" height="90" rx="10" fill="#0a0a0d" stroke="#6b6b76" stroke-width="1.5"/>
  <text x="485" y="606" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#a8a8b3">DROPPED</text>
  <text x="485" y="628" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">before the full chain</text>
  <text x="485" y="645" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">is even pulled</text>

  <rect x="650" y="570" width="230" height="90" rx="10" fill="#141419" stroke="#1c8f3d" stroke-width="1.5"/>
  <text x="765" y="608" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#f5f5f7">FULL CHAIN PULLED</text>
  <text x="765" y="630" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#6b6b76">real structure gets evaluated</text>

  <path d="M 700,470 L 700,510 L 485,510 L 485,570" fill="none" stroke="#a8a8b3" stroke-width="1.75" stroke-dasharray="7 6" marker-end="url(#msArrowRejected)"/>
  <text x="595" y="503" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#a8a8b3">wide spread / no real market</text>

  <path d="M 765,470 L 765,570" fill="none" stroke="#33ff66" stroke-width="2" marker-end="url(#msArrowBright)"/>
  <text x="830" y="503" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" fill="#9fffb8">tight market</text>
</svg>
