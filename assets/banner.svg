<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MU/TH/UR 8400 — an autonomous options trading agent">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#33ff66" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1500" height="500" fill="#0a0a0d"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- terminal-window frame -->
  <rect x="30" y="30" width="1440" height="440" rx="12" fill="#000000" stroke="#1c8f3d" stroke-width="1.5"/>

  <!-- title bar -->
  <line x1="30" y1="92" x2="1470" y2="92" stroke="#1c8f3d" stroke-width="1"/>
  <circle cx="66" cy="61" r="7" fill="#33ff66"/>
  <circle cx="92" cy="61" r="7" fill="#33ff66"/>
  <circle cx="118" cy="61" r="7" fill="#33ff66"/>
  <text x="146" y="67" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="700" fill="#9fffb8" letter-spacing="1">MU/TH/UR 8400 IS LISTENING</text>
  <text x="1450" y="67" text-anchor="end" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="16" font-weight="700" fill="#9fffb8" letter-spacing="1">NOSTROMO</text>

  <!-- wordmark, centered -->
  <text x="750" y="270" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="76" font-weight="700" fill="#9fffb8" letter-spacing="3" filter="url(#softGlow)">MU/TH/UR 8400</text>

  <!-- subtitle -->
  <text x="750" y="322" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="22" fill="#6b6b76" letter-spacing="3">AUTONOMOUS OPTIONS TRADING AGENT</text>
  <text x="750" y="358" text-anchor="middle" font-family="Consolas, 'SF Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="17" font-weight="600" fill="#a8a8b3" letter-spacing="2">ALPACA AI TRADING AGENTS HACKATHON &#183; 2026</text>

  <!-- prompt cursor -->
  <rect x="712" y="374" width="12" height="18" fill="#33ff66"/>
</svg>
